spring:
  application:
    name: calisat-ms-inventario

  datasource:
    url: jdbc:postgresql://postgres:5432/calisat_inventario
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://login.microsoftonline.com/e5372bf0-c5e3-4286-887c-79069f209c1f/v2.0
          audience: d221f0d2-1a7c-4872-ad6c-367a1f0717ec

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized


# ---------------------------------------------------------------------------
# Integracion MS->MS (fase de conexion): credencial que los demas
# microservicios envian en X-Service-Token. Ver ServiceTokenFilter.
# ---------------------------------------------------------------------------
calisat:
  servicio:
    token: calisat-svc-7f3a9c21
